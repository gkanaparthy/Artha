<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Artha favicon: geometric line-art leaf, stroke-based -->
  <rect width="32" height="32" rx="6" fill="#0f1f2e"/>
  
  <!-- Leaf outline: rounded bottom + left, squared top-right corner -->
  <path d="M16 5 L25 5 L25 14 Q25 26 16 26 Q7 26 7 16 Q7 5 16 5 Z"
        fill="none" stroke="#2dd4bf" stroke-width="2"/>
  
  <!-- Main vein: curved diagonal from bottom-left to top-right -->
  <path d="M10 24 Q14 16 24 7" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Side veins branching off main vein -->
  <path d="M12 20 Q13 17 10 12" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M15 16 Q17 13 15 9" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M18 13 Q21 15 22 20" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round"/>
</svg>
